# D0: allowlist ONLY for known-safe placeholder shapes. Anything matching a
# real-secret rule outside these paths fails CI. Never add production values here.
[allowlist]
description = "placeholder and example values that look secret-shaped but authenticate nowhere"
paths = [
  '''\.env\.example$''',
  '''docs/''',
  '''evolution-go/docker/examples/''',
  '''.*_test\.go$''',
  '''.*\.test\.(mjs|js|ts)$''',
  '''\.sh\.example$''',
]
regexes = [
  '''change_me_in_production''',
  '''replace_with_''',
  '''CHANGE_ME_''',
  '''sua-chave''',
  '''minioadmin''',
  '''admin:admin@localhost''',
  '''postgres:(root|postgres|password|changeme)@localhost''',
  '''postgres:postgres@localhost''',
  '''your-webhook-endpoint\.example\.com''',
  '''evocrm\.example\.com''',
  '''ocp_test_database|ocp:test@''',
  '''stg-[a-z]+-[0-9]+''',
  '''testkey123''',
  '''FAKE_CLID_''',
  '''919876543210''',
  '''9876543210''',
  '''9000000000''',
]
