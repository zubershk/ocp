# Fly.io — OCP Bot (Go API). Deploy with:
#   fly deploy --config fly.bot.toml --remote-only
#
# The release_command runs migrations + seeds ONCE per deploy (equivalent to
# the bot-init one-shot container in docker-compose.yml). App machines set
# SKIP_MIGRATIONS=1 so replicas never race on schema changes.
#
# CRITICAL: auto_stop_machines = false and min_machines_running = 1.
# Stopping these machines would kill SSE streams, the Postgres LISTEN/NOTIFY
# subscriber, the broadcast worker and the campaign scheduler.

app = "ocp-bot" # TODO: rename to your unique Fly app name
primary_region = "sin" # TODO: choose the region closest to your customers

[build]
  dockerfile = "bot/Dockerfile"

[deploy]
  release_command = "/app/bot-ocp -run-migrations-only"

[env]
  BOT_PORT = "8090"
  SKIP_MIGRATIONS = "1"
  GIN_MODE = "release"
  # Non-secret scale settings (see docs/LOAD_TEST.md). Secrets go in Fly Secrets.
  RATE_LIMIT_BACKEND = "postgres"
  API_RATE_LIMIT_PER_MIN = "300"
  PUBLIC_READ_CACHE_TTL_SECS = "15"
  TENANT_CACHE_TTL_SECS = "300"
  BIZ_CONFIG_CACHE_TTL_SECS = "60"
  PG_PUBSUB_ENABLED = "true"
  PG_PHONE_LOCKS_ENABLED = "true"
  BROADCAST_ASYNC = "1"
  BROADCAST_WORKERS = "8"
  ORDER_STREAM_RESYNC_SECS = "0"
  METRICS_ENABLED = "1"
  LOG_FORMAT = "json"
  LOG_LEVEL = "info"
  ETAG_ENABLED = "1"
  STORAGE_BACKEND = "s3"
  STORAGE_REGION = "auto"
  STORAGE_USE_SSL = "1"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/ready"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Uploads must survive deploys. STORAGE_BACKEND=s3 is recommended; this volume
# is a fallback for local-mode debugging only.
[[mounts]]
  source = "bot_uploads"
  destination = "/app/uploads"
