name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Go bot ──
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ocp
          POSTGRES_USER: ocp
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25" # float patch: stdlib CVE fixes ride the 1.25.x train
      - name: Build bot
        working-directory: bot
        run: go build -v ./...
      - name: Vet bot
        working-directory: bot
        run: go vet ./...
      - name: Go vulnerability check
        working-directory: bot
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Test bot (strict tenant isolation)
        working-directory: bot
        env:
          SINGLE_TENANT_MODE: "0"
          OCP_TEST_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
          BOT_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
        run: go test -p 1 ./... -count=1
      - name: Guard no implicit tenant fallback on request paths
        working-directory: bot
        run: |
          echo "Checking for ResolveRestaurant(0) on SaaS handlers..."
          if grep -R "ResolveRestaurant(0)" --include="*.go" handlers | grep -q "ResolveRestaurant(0)"; then
            echo "Found disallowed ResolveRestaurant(0) on request path handler"
            grep -R "ResolveRestaurant(0)" --include="*.go" handlers
            exit 1
          fi
          echo "Handler guard passed"
          echo "Service wrapper fallbacks (tenant.go, bot_message, business_config) are allowlisted for open-source single-tenant compat"

  # ── Frontend ──
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Campaign runner ──
  campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: campaign-runner/package-lock.json
      - name: Install
        working-directory: campaign-runner
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: campaign-runner
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        working-directory: campaign-runner
        run: npm run build
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
