name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # ── Go bot ──
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ocp
          POSTGRES_USER: ocp
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25" # float patch: stdlib CVE fixes ride the 1.25.x train
      - name: Build bot
        working-directory: bot
        run: go build -v ./...
      - name: Vet bot
        working-directory: bot
        run: go vet ./...
      - name: Go vulnerability check
        working-directory: bot
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Test bot (strict tenant isolation)
        working-directory: bot
        env:
          SINGLE_TENANT_MODE: "0"
          OCP_TEST_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
          BOT_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
        run: go test -p 1 ./... -count=1
      - name: Guard no implicit tenant fallback on request paths
        working-directory: bot
        run: |
          echo "Checking for ResolveRestaurant(0) on SaaS handlers..."
          if grep -R "ResolveRestaurant(0)" --include="*.go" handlers | grep -q "ResolveRestaurant(0)"; then
            echo "Found disallowed ResolveRestaurant(0) on request path handler"
            grep -R "ResolveRestaurant(0)" --include="*.go" handlers
            exit 1
          fi
          echo "Handler guard passed"
          echo "Service wrapper fallbacks (tenant.go, bot_message, business_config) are allowlisted for open-source single-tenant compat"

  # ── Frontend ──
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks PR scan needs full history for the base..head range
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: frontend
        # Retry on registry outages; fail open only when the endpoint itself
        # is down (real findings still fail). Advisories are also covered
        # by Dependabot PRs, so a down endpoint must not block the repo.
        run: |
          for i in 1 2 3; do
            out=$(npm audit --omit=dev --audit-level=high 2>&1) && { echo "$out"; break; }
            if echo "$out" | grep -q "audit endpoint returned an error"; then
              echo "WARNING: npm audit endpoint unavailable (attempt $i/3)"
              [ "$i" = "3" ] && { echo "$out"; echo "Failing open with warning"; break; }
              sleep 15
            else
              echo "$out"; exit 1
            fi
          done
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Campaign runner ──
  campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks PR scan needs full history for the base..head range
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: campaign-runner/package-lock.json
      - name: Install
        working-directory: campaign-runner
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: campaign-runner
        # Retry on registry outages; fail open only when the endpoint itself
        # is down (real findings still fail). Advisories are also covered
        # by Dependabot PRs, so a down endpoint must not block the repo.
        run: |
          for i in 1 2 3; do
            out=$(npm audit --omit=dev --audit-level=high 2>&1) && { echo "$out"; break; }
            if echo "$out" | grep -q "audit endpoint returned an error"; then
              echo "WARNING: npm audit endpoint unavailable (attempt $i/3)"
              [ "$i" = "3" ] && { echo "$out"; echo "Failing open with warning"; break; }
              sleep 15
            else
              echo "$out"; exit 1
            fi
          done
      - name: Build
        working-directory: campaign-runner
        run: npm run build
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
