name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # Secret scan (whole repo incl. history; bot/evolution-go/release have no per-job scan)
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: leaked-then-purged secrets must still fail
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── SAST (CodeQL) — static analysis for Go + JS/TS ──
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@v3
        with:
          languages: go, javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ── Go bot ──
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ocp
          POSTGRES_USER: ocp
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go 1.27.4
        run: |
          curl -sSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o /tmp/go.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version
      - name: Build bot
        working-directory: bot
        run: go build -v ./...
      - name: Vet bot
        working-directory: bot
        run: go vet ./...
      - name: Go vulnerability check
        working-directory: bot
        # Fail closed: a known-vulnerable dependency must block the merge.
        # Pinned version (no @latest supply-chain risk). -scan module accepts
        # NO package pattern (use it bare) — adding ./... errors out with
        # "patterns are not accepted for module only scanning".
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          export PATH=$(go env GOPATH)/bin:$PATH
          govulncheck -scan module
      - name: Test bot (strict tenant isolation)
        working-directory: bot
        env:
          SINGLE_TENANT_MODE: "0"
          OTP_PEPPER: "ci-test-pepper-value"
          OCP_TEST_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
          BOT_DATABASE_URL: postgresql://ocp:test@localhost:5432/ocp?sslmode=disable
        run: go test -p 1 ./... -count=1
      - name: Guard no implicit tenant fallback on request paths
        working-directory: bot
        run: |
          echo "Checking for ResolveRestaurant(0) on SaaS handlers..."
          if grep -R "ResolveRestaurant(0)" --include="*.go" handlers | grep -q "ResolveRestaurant(0)"; then
            echo "Found disallowed ResolveRestaurant(0) on request path handler"
            grep -R "ResolveRestaurant(0)" --include="*.go" handlers
            exit 1
          fi
          echo "Handler guard passed"
          echo "Service wrapper fallbacks (tenant.go, bot_message, business_config) are allowlisted for open-source single-tenant compat"

  # ── Frontend ──
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks PR scan needs full history for the base..head range
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: frontend
        # Retry transient registry outages, but FAIL CLOSED: a vulnerable
        # release must never ship just because the audit endpoint was down.
        run: |
          for i in 1 2 3; do
            out=$(npm audit --omit=dev --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            if echo "$out" | grep -q "audit endpoint returned an error"; then
              echo "npm audit endpoint unavailable (attempt $i/3)"
              [ "$i" = "3" ] && { echo "$out"; echo "ERROR: audit endpoint unavailable after 3 attempts — failing closed"; exit 1; }
              sleep 15
            else
              echo "$out"; exit 1
            fi
          done
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Campaign runner ──
  campaign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks PR scan needs full history for the base..head range
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: campaign-runner/package-lock.json
      - name: Install
        working-directory: campaign-runner
        run: npm ci --ignore-scripts
      - name: Audit
        working-directory: campaign-runner
        # Retry transient registry outages, but FAIL CLOSED (see frontend).
        run: |
          for i in 1 2 3; do
            out=$(npm audit --omit=dev --audit-level=high 2>&1) && { echo "$out"; exit 0; }
            if echo "$out" | grep -q "audit endpoint returned an error"; then
              echo "npm audit endpoint unavailable (attempt $i/3)"
              [ "$i" = "3" ] && { echo "$out"; echo "ERROR: audit endpoint unavailable after 3 attempts — failing closed"; exit 1; }
              sleep 15
            else
              echo "$out"; exit 1
            fi
          done
      - name: Build
        working-directory: campaign-runner
        run: npm run build
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Infrastructure / deployment config ──
  infra-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go 1.27.4
        run: |
          curl -sSL https://go.dev/dl/go1.27.4.linux-amd64.tar.gz -o /tmp/go.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version
      - name: Validate compose, nginx, Vercel, Fly, Caddy and env templates
        working-directory: bot
        run: go run ./scripts/validate_infra -root ..
