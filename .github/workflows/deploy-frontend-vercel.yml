name: Deploy frontend to Vercel

# Production deploy of the static frontend. The API base URL is inlined at
# BUILD time by Vite, so VITE_API_BASE_URL must be set as a Vercel project
# environment variable (not only at runtime). See docs/DEPLOYMENT.md.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "vercel.json"
      - ".github/workflows/deploy-frontend-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel-production
  cancel-in-progress: false # never abandon a half-finished production deploy

env:
  VERCEL_CLI_VERSION: "46.0.1"

jobs:
  deploy:
    # Deploys are opt-in until the Vercel secrets are configured in the repo.
    # Set repository variable DEPLOY_VERCEL_ENABLED=true (and the three
    # VERCEL_* secrets) to enable. Without it, this job is skipped, not failed.
    if: ${{ vars.DEPLOY_VERCEL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI (pinned)
        run: npm install --global vercel@${VERCEL_CLI_VERSION}

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with production env (VITE_API_BASE_URL inlined here)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
