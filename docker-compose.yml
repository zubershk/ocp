services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16.4-alpine3.20@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_DB: ocp
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocp"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "${PG_CPU_LIMIT:-2.0}"
          memory: "${PG_MEM_LIMIT:-2G}"

  # ── PgBouncer (transaction pooling — lets bot replicas scale past PG connection cap) ──
  pgbouncer:
    image: edoburu/pgbouncer:v1.21.0-p1 # TF-PIN: pin to digest in your registry before production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ocp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-2000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL:-5}
      SERVER_IDLE_TIMEOUT: 600
      AUTH_TYPE: md5
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U ocp -d ocp -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # ── Evolution GO (WhatsApp API) ──
  evolution:
    image: atendai/evolution-go@sha256:b1ab38aed60dc02296e3ef4a859d52f8f0f246d137ce2f9d92a4936dc8c6acb9 # digest-pinned (was :latest)
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY:-}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-}
      - POSTGRES_USERS_DB=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ocp?sslmode=${PGSSLMODE:-disable}
      - POSTGRES_AUTH_DB=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ocp?sslmode=${PGSSLMODE:-disable}
      - DATABASE_SAVE_MESSAGES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/ocp?sslmode=${PGSSLMODE:-disable}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8090}
      - DELIVERY_RETRIES=5
      - WEBHOOK_GLOBAL_ENABLED=false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${EVOLUTION_CPU_LIMIT:-2.0}"
          memory: "${EVOLUTION_MEM_LIMIT:-2G}"

  # ── One-shot migrations/seeds (run before app replicas start) ──
  bot-init:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: "no"
    command: ["/app/bot-ocp", "-run-migrations-only"]
    environment:
      - BOT_DATABASE_URL=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@pgbouncer:6432/ocp?sslmode=disable
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:?Set BOT_ADMIN_KEY in .env}
      - INITIAL_ORG_NAME=${INITIAL_ORG_NAME:-}
      - INITIAL_ORG_SLUG=${INITIAL_ORG_SLUG:-}
      - INITIAL_CURRENCY=${INITIAL_CURRENCY:-INR}
      - INITIAL_TIMEZONE=${INITIAL_TIMEZONE:-UTC}
      - INITIAL_OUTLET_NAME=${INITIAL_OUTLET_NAME:-Main Outlet}
      - TEMPLATE_RESTAURANT_SLUG=${TEMPLATE_RESTAURANT_SLUG:-}
      - GIN_MODE=release
    depends_on:
      pgbouncer:
        condition: service_healthy

  # ── OCP Bot (Go API) — horizontally scalable ──
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${BOT_REPLICAS:-1}
      resources:
        limits:
          cpus: "${BOT_CPU_LIMIT:-1.0}"
          memory: "${BOT_MEM_LIMIT:-512M}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - BOT_PORT=8090
      - BOT_DATABASE_URL=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@pgbouncer:6432/ocp?sslmode=disable
      - SKIP_MIGRATIONS=1
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-OCP}
      - EVOLUTION_INSTANCE_TOKEN=${EVOLUTION_INSTANCE_TOKEN:-}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET:?Set EVOLUTION_WEBHOOK_SECRET in .env}
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:?Set BOT_ADMIN_KEY in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost}
      - RESTAURANT_WHATSAPP_NUMBER=${RESTAURANT_WHATSAPP_NUMBER:-}
      - RESTAURANT_NAME=${RESTAURANT_NAME:-Orange Cheese Pizza}
      - DELIVERY_FEE=${DELIVERY_FEE:-0}
      - SINGLE_TENANT_MODE=${SINGLE_TENANT_MODE:-true}
      - BILLING_ENABLED=${BILLING_ENABLED:-false}
      - BASE_DOMAIN=${BASE_DOMAIN:-ocp.app}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - OTP_PEPPER=${OTP_PEPPER:-}
      - REDIS_URL=${REDIS_URL:-}
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-postgres}
      - API_RATE_LIMIT_PER_MIN=${API_RATE_LIMIT_PER_MIN:-300}
      - PUBLIC_READ_CACHE_TTL_SECS=${PUBLIC_READ_CACHE_TTL_SECS:-15}
      - TENANT_CACHE_TTL_SECS=${TENANT_CACHE_TTL_SECS:-300}
      - BIZ_CONFIG_CACHE_TTL_SECS=${BIZ_CONFIG_CACHE_TTL_SECS:-60}
      - PG_PUBSUB_ENABLED=${PG_PUBSUB_ENABLED:-true}
      - PG_PHONE_LOCKS_ENABLED=${PG_PHONE_LOCKS_ENABLED:-true}
      - BROADCAST_ASYNC=${BROADCAST_ASYNC:-true}
      - BROADCAST_WORKERS=${BROADCAST_WORKERS:-8}
      - ORDER_STREAM_RESYNC_SECS=${ORDER_STREAM_RESYNC_SECS:-0}
      - METRICS_ENABLED=${METRICS_ENABLED:-1}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ETAG_ENABLED=${ETAG_ENABLED:-1}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-}
      - STORAGE_REGION=${STORAGE_REGION:-us-east-1}
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-}
      - STORAGE_USE_SSL=${STORAGE_USE_SSL:-1}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
    expose:
      - "8090"
    volumes:
      - bot_uploads:/app/uploads
    depends_on:
      bot-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Load balancer (round-robin across bot replicas; sticky not required) ──
  bot-lb:
    image: nginx:1.27-alpine # TF-PIN: pin to digest in your registry before production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./bot-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

  # ── Frontend (React + nginx) ──
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "3000:80"
    depends_on:
      bot-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # ── Campaign Runner ──
  campaign:
    build:
      context: .
      dockerfile: campaign-runner/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=3001
      - BOT_API_URL=http://bot-lb:80
      - BOT_ADMIN_KEY=${BOT_ADMIN_KEY:?Set BOT_ADMIN_KEY in .env}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost:3001,http://localhost:3000,http://localhost}
      - BROADCAST_POLL_TIMEOUT_MS=${BROADCAST_POLL_TIMEOUT_MS:-600000}
      - BROADCAST_POLL_INTERVAL_MS=${BROADCAST_POLL_INTERVAL_MS:-1000}
      - CAMPAIGN_DATABASE_URL=postgresql://ocp:${DB_PASSWORD:?Set DB_PASSWORD in .env}@pgbouncer:6432/ocp?sslmode=disable
      - CAMPAIGN_PG_ENABLED=${CAMPAIGN_PG_ENABLED:-1}
      - CAMPAIGN_PG_REFRESH_MS=${CAMPAIGN_PG_REFRESH_MS:-5000}
      - CAMPAIGN_ENCRYPTION_KEY=${CAMPAIGN_ENCRYPTION_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - campaign_data:/app/data
      - campaign_uploads:/app/uploads
    depends_on:
      bot-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  bot_uploads:
  campaign_data:
  campaign_uploads:
