# Load balancer for OCP bot replicas.
# Round-robin is safe: shared state lives in Postgres (NOTIFY fan-out, advisory
# locks, rate-limit counters, broadcast queue) — no sticky sessions required.

upstream ocp_bot {
    server bot:8090 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # SSE streams must not be buffered or killed by idle timeouts.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    keepalive_timeout 3600s;

    location / {
        proxy_pass http://ocp_bot;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
