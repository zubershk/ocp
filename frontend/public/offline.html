<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Offline</title></head>
<body style="font-family:system-ui; display:grid; place-items:center; min-height:100vh; background:#fefcf8; color:#1c1917;">
  <div style="text-align:center; padding:2rem;">
    <div style="font-size:3rem;">🍕</div>
    <h1 style="margin-top:1rem; font-size:1.5rem;">You're offline</h1>
    <p style="color:#78716c; margin-top:0.5rem;">Check your internet connection and try again.</p>
    <button onclick="location.reload()" style="margin-top:1.5rem; padding:0.75rem 2rem; background:#ea580c; color:white; border:none; border-radius:1rem; font-weight:600; cursor:pointer;">Retry</button>
  </div>
</body>
</html>
